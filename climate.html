<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>1.5℃ 지키기 대작전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 프로젝터용 한 화면. 왼쪽 큰 온도계 + 오른쪽 8개 나라 카드(초록·노랑·빨강 카드 선택), 라운드마다 '공개' → 닥친 일 카드 */
:root{
  --bg:#F1EEE6; --surface:#FFFFFF; --surface2:#F7F5EF; --ink:#1B1B1F; --muted:#5E5C57; --line:#DAD5C9;
  --green:#1E8E5A; --yellow:#E2A400; --red:#D2382B; --goal:#1E8E5A; --cold:#3C82C4;
  --f-disp:"Black Han Sans","Apple SD Gothic Neo",sans-serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:16px; --shadow:0 2px 0 rgba(0,0,0,.08),0 8px 22px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141412; --surface:#1E1E1B; --surface2:#262622; --ink:#F2EFE8; --muted:#B0ACA2; --line:#3A3934;
  --green:#3CC383; --yellow:#F2C230; --red:#F06A5C; --goal:#3CC383; --cold:#6FB0EA; --shadow:0 2px 0 rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141412; --surface:#1E1E1B; --surface2:#262622; --ink:#F2EFE8; --muted:#B0ACA2; --line:#3A3934;
  --green:#3CC383; --yellow:#F2C230; --red:#F06A5C; --goal:#3CC383; --cold:#6FB0EA; --shadow:0 2px 0 rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cold);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
.disp{font-family:var(--f-disp);font-weight:400;letter-spacing:.01em}
h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(40px,8vw,78px)}
h2{font-family:var(--f-disp);font-weight:400;font-size:clamp(26px,4vw,36px)}
h3{font-size:19px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12.5px}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:20px 44px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.btn{appearance:none;border:0;border-radius:14px;padding:13px 22px;font-weight:700;font-size:17px;cursor:pointer;background:var(--ink);color:var(--bg)}
.btn.big{font-family:var(--f-disp);font-weight:400;font-size:24px;padding:14px 28px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.4;cursor:not-allowed}

.game{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.game{grid-template-columns:230px minmax(0,1fr)}}

/* 온도계 */
.thermo{display:flex;gap:14px;align-items:stretch}
@media (min-width:900px){.thermo{flex-direction:column;align-items:center;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}}
.tube{position:relative;width:64px;height:360px;border-radius:32px;background:var(--surface2);border:3px solid var(--ink);flex:none;overflow:hidden}
@media (max-width:899px){.tube{height:220px;width:52px}}
.merc{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,#F0B43C,#E06A2C 50%,#C0281F);transition:height 1.2s cubic-bezier(.2,.8,.2,1)}
.mark{position:absolute;left:0;right:0;border-top:2px dashed var(--ink);font-size:11px;font-weight:700}
.mark span{position:absolute;left:68px;top:-9px;white-space:nowrap}
.mark.goal{border-top:3px solid var(--goal)}
.tread{display:flex;flex-direction:column;gap:6px;justify-content:center}
.tnum{font-family:var(--f-disp);font-size:clamp(42px,6vw,54px);line-height:1}
.yr{font-weight:700;font-size:15px}

/* 나라 카드 */
.nations{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.nat{display:flex;flex-direction:column;gap:10px;border-top:8px solid}
.nat .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.nat .nm{font-family:var(--f-disp);font-size:26px;line-height:1.1}
.coins{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:18px}
.coins i{font-style:normal}
.weight{font-size:12.5px;color:var(--muted)}
.wbar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.wbar b{display:block;height:100%;background:var(--ink)}
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pick{appearance:none;cursor:pointer;border:2.5px solid transparent;border-radius:12px;padding:8px 4px;font-weight:700;font-size:14px;line-height:1.25;color:#fff;text-align:center}
.pick small{display:block;font-weight:500;font-size:11.5px;opacity:.95}
.pick.g{background:var(--green)} .pick.y{background:var(--yellow);color:#1b1b1f} .pick.r{background:var(--red)}
.pick[aria-pressed="false"]{opacity:.32}
.pick[aria-pressed="true"]{border-color:var(--ink);transform:translateY(-1px)}
.pick[disabled]{cursor:not-allowed}
.hidden-pick{font-size:13px;color:var(--muted)}
.gone{opacity:.55;filter:grayscale(.6)}

.legend3{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.lg{border-radius:14px;padding:12px 14px;color:#fff}
.lg.g{background:var(--green)} .lg.y{background:var(--yellow);color:#1b1b1f} .lg.r{background:var(--red)}
.lg b{font-family:var(--f-disp);font-weight:400;font-size:22px;display:block}

.fund{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select{padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface)}

/* IPCC 카드 */
.ipcc{border-radius:16px;background:color-mix(in srgb,var(--sc) 14%,var(--surface));border:2px solid var(--sc);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ih{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px}
.ik{background:var(--sc);color:#fff;font-family:var(--f-disp);font-size:20px;padding:2px 10px;border-radius:99px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.tile{background:var(--surface);border-radius:10px;padding:7px 9px;font-size:13px;font-weight:700;line-height:1.35;color:var(--ink)}
.ipcc.big{padding:18px}
.ipcc.big .ik{font-size:30px;padding:4px 16px}
.ipcc.big .ih{font-size:20px}
.ipcc.big .tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.ipcc.big .tile{font-size:16px;padding:12px;text-align:center;color:var(--sc)}
:root[data-theme="dark"] .ipcc.big .tile{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ipcc.big .tile{color:var(--ink)}}
.idesc{font-size:16px;line-height:1.7}
.isrc{font-size:11.5px;color:var(--muted)}
.stairs{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));align-items:start}
@media (max-width:700px){.stairs>div{margin-top:0!important}}
/* 정책 카드 */
.pcards{display:grid;gap:6px}
.pcard{appearance:none;text-align:left;cursor:pointer;border:2px solid var(--line);border-left:10px solid;border-radius:12px;padding:8px 10px;background:var(--surface);display:grid;gap:4px;font-size:14px;line-height:1.35}
.pcard.g{border-left-color:var(--green)} .pcard.y{border-left-color:var(--yellow)} .pcard.r{border-left-color:var(--red)}
.pcard .pt{font-weight:700}
.pcard .pm{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:12px}
.pcard .ptag{color:var(--muted)} .pcard .pc{font-weight:700;white-space:nowrap}
.pcard[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.pcard.g[aria-pressed="true"]{background:color-mix(in srgb,var(--green) 16%,var(--surface))}
.pcard.y[aria-pressed="true"]{background:color-mix(in srgb,var(--yellow) 20%,var(--surface))}
.pcard.r[aria-pressed="true"]{background:color-mix(in srgb,var(--red) 14%,var(--surface))}
.pcard[aria-pressed="false"]{opacity:.45}
.pcard[disabled]{cursor:not-allowed;opacity:.35}
.crp{display:block;font-weight:500;font-size:11.5px;color:var(--muted);line-height:1.3}
.echip{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--line);color:#1b1b1f}
.echip.g{background:var(--green);color:#fff} .echip.y{background:var(--yellow)} .echip.r{background:var(--red);color:#fff}
.grid3r{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.theme{display:flex;flex-direction:column;gap:4px;background:var(--surface2);border-radius:12px;padding:10px 12px}
/* 기금 요청 */
.askfund{font-size:13px;line-height:1.45;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--yellow) 22%,var(--surface));border:1.5px dashed var(--yellow)}
/* 기금 */
.role{display:inline-block;align-self:flex-start;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px}
.role.give{background:color-mix(in srgb,var(--cold) 16%,var(--surface));color:var(--cold)}
.role.recv{background:color-mix(in srgb,var(--yellow) 26%,var(--surface));color:var(--ink)}
.fsteps{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.fstep{display:flex;flex-direction:column;gap:6px;min-width:0}
.fl{font-weight:700;font-size:14px}
.fbtns{display:flex;flex-wrap:wrap;gap:6px}
.fbtn{appearance:none;cursor:pointer;border:2px solid var(--line);border-left:6px solid var(--nc);background:var(--surface);border-radius:10px;padding:6px 10px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.fbtn small{font-weight:500;font-size:11.5px;color:var(--muted)}
.fbtn[aria-pressed="true"]{border-color:var(--ink);background:color-mix(in srgb,var(--nc) 14%,var(--surface))}
.farrow{font-size:28px;font-weight:700;padding-bottom:10px}
.amt{display:flex;align-items:center;gap:10px}
.amt b{font-family:var(--f-disp);font-size:26px;min-width:1.2em;text-align:center}
.flog{display:flex;flex-wrap:wrap;gap:6px}
.chip2{font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line)}
/* 기금 보완 */
.fmodes{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.fmode{appearance:none;cursor:pointer;text-align:left;border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface);display:flex;flex-direction:column;gap:2px}
.fmode small{font-size:12px;color:var(--muted)}
.fmode[aria-pressed="true"]{border-color:var(--ink);background:var(--surface2)}
.pool{display:flex;flex-direction:column;gap:6px;min-width:200px}
.pbar{height:16px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--cold)}
.techon{font-size:13px;padding:6px 10px;border-radius:10px;background:color-mix(in srgb,var(--cold) 14%,var(--surface));font-weight:700}
.scroll{overflow-x:auto}
table.ledger{width:100%;border-collapse:collapse;font-size:15px;min-width:480px;font-variant-numeric:tabular-nums}
.ledger th,.ledger td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
.ledger th{font-size:12.5px;color:var(--muted)}
/* 결과 */
.contrib{display:grid;gap:8px}
.cr{display:grid;grid-template-columns:150px minmax(0,1fr) 64px;gap:10px;align-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.cr .b{height:22px;border-radius:6px;background:var(--surface2);overflow:hidden}
.cr .b i{display:block;height:100%;transition:width 1s}
.events{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.ev{border-left:8px solid;display:flex;flex-direction:column;gap:6px}
.ev .who{font-size:13px;font-weight:700;color:var(--muted)}
.ev .hit{font-weight:700;color:var(--red);font-size:14px}
.news{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:14px 18px}
.news b{font-family:var(--f-disp);font-weight:400;font-size:22px;display:block}
.end{font-family:var(--f-disp);font-size:clamp(34px,6vw,58px);line-height:1.15}
.steps{margin:0;padding-left:22px;display:grid;gap:6px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:30}
.foot{margin-top:26px;font-size:12.5px;color:var(--muted)}
.pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pop{from{transform:scale(.92);opacity:.001}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.merc,.cr .b i{transition:none}}
</style>

<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const START=1.2, GOAL=1.5;
const YEARS=['2025 → 2050','2050 → 2075','2075 → 2100'];
// w: '그대로' 선택 시 25년 동안 올리는 온도(℃). 조금=60%, 크게=15%
const N=[
 {id:'cn',name:'중국',col:'#C8352B',w:.32,coin:10,who:'세계 배출 1위. 공장과 석탄 발전소가 많아요.',kid:'린'},
 {id:'us',name:'미국',col:'#2F5D9B',w:.21,coin:12,who:'지금까지 가장 많이 배출한 부자 나라예요.',kid:'에이든'},
 {id:'in',name:'인도',col:'#E08A1E',w:.19,coin:4,who:'인구 1위. 아직 가난한 사람이 많아 발전이 급해요.',kid:'아라브'},
 {id:'eu',name:'유럽 연합',col:'#1F7F6E',w:.13,coin:10,who:'기후 대응에 앞장서 왔지만 에너지는 수입해요.',kid:'레나'},
 {id:'kr',name:'대한민국',col:'#6A4BB3',w:.065,coin:8,who:'제조업 수출국. 1인당 배출이 꽤 많아요.',kid:'서윤'},
 {id:'sa',name:'사우디아라비아',col:'#5E7A2E',w:.05,coin:12,who:'세계적인 석유 수출국. 나라 살림의 대부분이 석유 수출에서 나와요.',kid:'파이살'},
 {id:'br',name:'브라질',col:'#2E9A4E',w:.05,coin:5,who:'아마존 열대 우림의 나라. 숲을 베어 목장과 콩밭을 늘려 왔어요.',kid:'마리아'},
 {id:'tv',name:'투발루',col:'#1B9EC0',w:.008,coin:2,who:'해발 2m 남짓한 섬나라. 배출은 거의 0이에요.',kid:'테바'}
];
const NB=Object.fromEntries(N.map(n=>[n.id,n]));
const ROLE={us:'give',eu:'give',kr:'give',cn:'give',sa:'give',in:'recv',br:'recv',tv:'recv'};
const GIVERS=N.filter(n=>ROLE[n.id]==='give'),RECV=N.filter(n=>ROLE[n.id]==='recv');
const roleBadge=id=>ROLE[id]==='give'?'<span class="role give">💰 기금을 내는 나라</span>':'<span class="role recv">🙏 기금을 받는 나라</span>';
const CH={g:{t:'크게 감축',cost:3,k:.08,d:'석탄 퇴출·재생 에너지 전환'},y:{t:'조금 감축',cost:1,k:.5,d:'할 수 있는 만큼만'},r:{t:'그대로',cost:0,k:1,d:'경제 성장이 먼저'}};
const NEWS=[
 {t:'유가 폭등!',d:'석유값이 치솟아 화석 연료로 돈을 버는 나라가 늘었어요. 이번 라운드 빨강 카드를 고른 나라는 코인 +1.',fx:'oil'},
 {t:'태양광 값이 반값으로!',d:'재생 에너지 기술이 싸졌어요. 이번 라운드 초록 카드 비용이 2코인이에요.',fx:'solar'},
 {t:'세계 경제 위기',d:'모든 나라 살림이 빠듯해졌어요. 이번 라운드 시작 코인 수입이 +1뿐이에요.',fx:'crisis'}
];
const THEME=[
 {t:'에너지를 무엇으로 만들까?',src:'교과서 p.144 신·재생 에너지 · EBS 국가적 차원'},
 {t:'세계와 어떤 약속을 할까?',src:'교과서 p.143 국제적 차원 · 파리 협정 · ODA'},
 {t:'제도와 기술, 생활을 어떻게 바꿀까?',src:'교과서 p.144·149 · EBS 배출권 거래제·탄소 국경 조정 제도'}
];
// CARDS[나라][라운드] = {g,y,r} : [정책, 교과서 개념]
const CARDS={
 cn:[{g:['석탄 발전소 신규 건설 중단, 태양광·풍력 대폭 확대','신·재생 에너지'],y:['석탄은 유지하고 큰 강에 수력 발전 댐 건설','수력 발전 (유량이 풍부한 지역)'],r:['값싼 석탄 화력 발전으로 공장 계속 늘리기','화석 에너지 의존']},

let S=(function(){const f=fresh(),o=load();if(!o)return f;const m=Object.assign(f,o);N.forEach(n=>{if(m.coins[n.id]==null)m.coins[n.id]=n.coin;});['given','got','dmg','tech','lost','pick'].forEach(k=>{if(!m[k])m[k]={};});if(m.pool==null)m.pool=0;if(!m.fm)m.fm='oda';return m;})();
function load(){try{const v=localStorage.getItem(KEY);return v?JSON.parse(v):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
const fT=t=>'+'+t.toFixed(2)+'℃';

function cost(c,id){let v=c==='g'&&S.news&&S.news.fx==='solar'?2:CH[c].cost;if(c==='g'&&id&&S.tech&&S.tech[id])v=Math.max(1,v-1);return v}

function thermo(t){
  const lo=1.0,hi=4.3,pct=v=>Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100));
  const col=t<1.5?'var(--goal)':t<2?'var(--yellow)':'var(--red)';
  return `<div class="thermo"><div class="tube" aria-label="지구 평균 기온"><div class="merc" style="height:${pct(t)}%"></div>
   ${[[1.5,'1.5℃ 목표','goal'],[2,'2℃',''],[3,'3℃',''],[4,'4℃','']].map(([v,l,c])=>`<div class="mark ${c}" style="bottom:${pct(v)}%"></div>`).join('')}</div>
   <div class="tread"><div class="tiny muted" style="font-weight:700">지구 평균 기온 (산업화 이전 대비)</div><div class="tnum" style="color:${col}">${fT(t)}</div>
   <div class="yr">${S.round<3?`지금 ${['2025','2050','2075'][S.round]}년`:'2100년'}</div>
   <div class="tiny"><span style="color:var(--goal);font-weight:700">━ 1.5℃ 목표</span> · ┅ 2·3·4℃</div></div></div>`;
}

function render(){
  const v={intro,play,reveal,end}[S.screen]();

   <div class="card stack"><h3>기후정의 장부: 누가 데우고, 누가 돕고, 누가 피해를 입었나</h3>
    <div class="scroll"><table class="ledger"><thead><tr><th>나라</th><th>온도를 올린 정도</th><th>낸 기금</th><th>받은 기금</th><th>피해 복구비</th></tr></thead><tbody>${N.map(n=>{const up=S.hist.reduce((s,h)=>s+(h.ups.find(u=>u.id===n.id)||{up:0}).up,0);return `<tr><td><b style="color:${n.col}">●</b> ${n.name}</td><td>+${up.toFixed(2)}℃</td><td>${S.given[n.id]?'🪙 '+S.given[n.id]:'-'}</td><td>${S.got[n.id]?'🪙 '+S.got[n.id]:'-'}</td><td>${S.lost[n.id]?'나라를 잃음':(S.dmg[n.id]?'🪙 '+S.dmg[n.id]:'-')}</td></tr>`}).join('')}</tbody></table></div>
    <p class="small muted">많이 데운 나라가 그만큼 도왔나요? "공동의 그러나 차별화된 책임"을 생각해 보세요.</p></div>
   <h2>2100년 지구: ${IPCC[L].k} 시나리오</h2>${ipccCard(L,true)}
   <h2>2100년, 우리 캐릭터의 삶</h2>
   <div class="events">${N.map(n=>`<div class="card ev" style="border-left-color:${n.col}"><span class="who">${n.name} · ${n.kid}</span><p>${S.lost[n.id]?ENDLIFE[n.id][2]:ENDLIFE[n.id][k]}</p><span class="tiny muted">온도를 올린 정도 ${S.hist.reduce((s,h)=>s+(h.ups.find(u=>u.id===n.id)||{up:0}).up,0).toFixed(2)}℃</span></div>`).join('')}</div>
   <div class="card stack"><h3>함께 생각해 볼 질문</h3><ol class="steps">
    <li>투발루와 브라질 같은 나라는 지구 온도를 적게 올렸는데 피해는 컸어요. 공정한가요? <span class="muted small">(기후정의)</span></li>
    <li>우리 나라는 왜 그 정책을 골랐나요? 초록 정책을 막은 것은 무엇이었나요? (일자리, 전기 요금, 발전할 권리…)</li>
    <li>오늘 나온 정책 가운데 국제적·국가적·개인적 차원의 노력을 하나씩 찾아보세요.</li>
    <li>직접 원조(양자 협력)와 녹색 기후 기금(다자 협력)은 어떤 점이 다를까요? 우리 모둠은 왜 그 방법을 골랐나요?</li>
    <li>1.5℃를 지키려면 무엇이 더 필요했을까요? <span class="muted small">(교과서 p.143~144)</span></li></ol></div>
   <div class="row"><button class="btn big" data-act="again">다시 하기</button></div>
  </div>`;
}

function doReveal(){
  const before=S.temp;const ups=[],hits=[];const picks={...S.pick};
  N.forEach(n=>{if(S.lost[n.id]){ups.push({id:n.id,c:'',up:0});return;}const c=S.pick[n.id];S.coins[n.id]-=cost(c,n.id);if(c==='r'&&S.news&&S.news.fx==='oil')S.coins[n.id]+=1;ups.push({id:n.id,c,up:n.w*CH[c].k});});
  S.temp=+(S.temp+ups.reduce((s,u)=>s+u.up,0)).toFixed(3);
  ups.sort((a,b)=>b.up-a.up);
  const L=lvl(S.temp);
  N.forEach(n=>{if(S.lost[n.id]){hits.push({id:n.id,text:'나라는 사라졌지만 테바는 다른 나라에서 고향 이야기를 전해요.',loss:0});return;}
    const [text,loss]=HIT[n.id][L];let lost=false;
    if(n.id==='tv'&&L>=1){S.lost.tv=true;lost=true;}
    const dl=Math.min(S.coins[n.id],loss>=5?0:loss);S.dmg[n.id]=(S.dmg[n.id]||0)+dl;S.coins[n.id]-=dl;
    hits.push({id:n.id,text,loss:loss,lost});});
  S.hist.push({picks,ups});S.last={before,ups,hits};S.round++;S.pick={};S.screen='reveal';
}
function startRound(){
  S.news=S.round===0?null:NEWS[(S.round-1+Math.floor(Math.random()*3))%3];
  const inc=S.news&&S.news.fx==='crisis'?1:2;
  if(S.round>0)N.forEach(n=>{if(!S.lost[n.id])S.coins[n.id]+=inc});
  S.flog=[];S.tech={};S.poolRound=0;S.screen='play';
}
function bind(){
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==='start'){S=fresh();startRound();render();}
    else if(a==='reveal'){doReveal();render();window.scrollTo(0,0);}
    else if(a==='next'){startRound();render();window.scrollTo(0,0);}
    else if(a==='end'){S.screen='end';render();window.scrollTo(0,0);}
    else if(a==='again'){S=fresh();render();window.scrollTo(0,0);}
    else if(a==='fund'){const f=S.ff||'us',t=S.ft||'in',m=S.fm||'oda';const v=m==='tech'?2:(S.fa||2);
      if(S.coins[f]<v)return toast(`${NB[f].name}의 코인이 모자라요`);
      if(m!=='gcf'&&S.lost[t])return toast('받을 나라를 골라 주세요');
      S.coins[f]-=v;S.given[f]=(S.given[f]||0)+v;
      if(m==='oda'){S.coins[t]+=v;S.got[t]=(S.got[t]||0)+v;S.flog.push(`💸 직접 원조 ${NB[f].name} → ${NB[t].name} ${v}`);}
      else if(m==='gcf'){S.pool=(S.pool||0)+v;S.poolRound=(S.poolRound||0)+v;S.flog.push(`🌐 ${NB[f].name} → 녹색 기후 기금 ${v}`);}
      else {if(S.tech[t])return toast(`${NB[t].name}는 이미 기술 이전을 받았어요`);S.tech[t]=true;S.got[t]=(S.got[t]||0);S.flog.push(`🔧 기술 이전 ${NB[f].name} → ${NB[t].name}`);}
      Object.keys(S.pick).forEach(id=>{if(S.coins[id]<cost(S.pick[id],id))delete S.pick[id]});
      toast(S.flog[S.flog.length-1]);render();}
    else if(a==='split'){const recv=RECV.filter(n=>!S.lost[n.id]);if(!recv.length)return;const each=Math.floor(S.pool/recv.length);const bonus=(S.poolRound||0)>=FUNDGOAL?1:0;
      if(!each&&!bonus)return toast('받는 나라 수보다 모인 코인이 적어요');
      recv.forEach(n=>{S.coins[n.id]+=each+bonus;S.got[n.id]=(S.got[n.id]||0)+each+bonus;});S.pool-=each*recv.length;
      S.flog.push(`🌐 녹색 기후 기금 배분: ${recv.map(n=>n.name).join('·')} 각 ${each}${bonus?' + 목표 달성 보너스 1':''}`);S.poolRound=0;toast('국제기구가 기금을 나눠 줬어요');render();}
  });
  document.querySelectorAll('[data-fm]').forEach(b=>b.onclick=()=>{S.fm=b.dataset.fm;render();});
  document.querySelectorAll('[data-ff]').forEach(b=>b.onclick=()=>{S.ff=b.dataset.ff;render();});
  document.querySelectorAll('[data-ft]').forEach(b=>b.onclick=()=>{S.ft=b.dataset.ft;render();});
  document.querySelectorAll('[data-fa]').forEach(b=>b.onclick=()=>{S.fa=Math.max(1,Math.min(6,(S.fa||2)+ +b.dataset.fa));render();});
  document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{S.pick[b.dataset.n]=b.dataset.c;render();});
}
render();
})();
</script>
